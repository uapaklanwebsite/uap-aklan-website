<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />

<body class="flex flex-col min-h-full bg-[#030C09] text-gray-900 antialiased">

 <section id="activities" class="min-h-[calc(100vh-4rem)] bg-gradient-to-b from-[#030C09] via-[#0D3628] to-[#030C09] py-20 lg:py-14">

            <button class="activity-btn">January</button>

        <!-- Year -->

            <button class="activity-btn">August</button>

            <button class="activity-btn">October</button>
            <button class="activity-btn">November</button>
            <button class="activity-btn">December</button>

        </div>

    </div>
 </section>
