<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Member Directory of UAP Aklan Chapter." />
  <title>Directory | UAP Aklan Chapter</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="flex flex-col min-h-full bg-[#030C09] text-gray-900 antialiased">

  <!-- Header / Navigation Placeholder -->
  <div id="navbar-placeholder"></div>

  <section id="directory" class="min-h-[calc(100vh-4rem)] bg-gradient-to-b from-[#030C09] via-[#0D3628] to-[#030C09] py-20 lg:py-14">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
      <!-- Section Label -->
      <div class="mb-12 flex items-center gap-4">
          <span class="text-xs font-semibold tracking-[0.25em] text-[#D2B866]">03</span>
          <div class="h-px w-14 bg-[#D2B866]"></div>
          <p class="text-4xl font-bold uppercase tracking-[0.01em] text-[#D2B866]">Members Directory</p>
      </div>
      <!-- Table -->
      <div class="overflow-x-auto rounded-lg">
        <table class="min-w-full border-collapse">
          <!-- Header -->
          <thead>
            <tr class="border-y border-[#D4AF37]/20">
                <th class="py-5 text-left text-xs font-semibold uppercase tracking-widest text-[#D2B866]">Name</th>
                <th class="py-5 text-left text-xs font-semibold uppercase tracking-widest text-[#D2B866]">Based In</th>
                <th class="py-5 text-center text-xs font-semibold uppercase tracking-widest text-[#D2B866]">Social</th>
            </tr>
          </thead>
          <!-- Body -->
          <tbody>
            <!-- Row -->
            <tr class="border-b border-white/10 hover:bg-white/5 transition">
              <td class="py-6 font-medium text-white">Arch. Maria Santos</td>
              <td class="py-6 text-gray-300">Kalibo, Aklan</td>
              <td class="py-6 text-center">
                <a href="#" class="inline-flex h-10 w-10 items-center justify-center text-[#062E23] transition hover:scale-110">
                  <!-- Facebook Icon -->
                  <img src="/assets/img/fblogo.png" alt="" class="w-8">
                </a>
              </td>
            </tr>
            <!-- Duplicate rows -->
            <tr class="border-b border-white/10 hover:bg-white/5 transition">
              <td class="py-6 font-medium text-white">Arch. Jose Reyes</td>
              <td class="py-6 text-gray-300">Malay, Aklan</td>
              <td class="py-6 text-center">
                <a href="#" class="inline-flex h-10 w-10 items-center justify-center text-[#062E23] transition hover:scale-110">
                  <!-- Facebook Icon -->
                  <img src="/assets/img/fblogo.png" alt="" class="w-8">
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Shared App JS Module -->
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
