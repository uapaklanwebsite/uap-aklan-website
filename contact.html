<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact UAP Aklan Chapter." />
  <title>Contact | UAP Aklan Chapter</title>
  <link rel="icon" type="image/png" href="/assets/img/uap-aklan-logo.jpg" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="flex flex-col min-h-full bg-[#030C09] text-gray-900 antialiased">
  <!-- Header / Navigation Placeholder -->
  <load src="./components/navbar.html" />

  <section id="contact" class="relative min-h-[calc(100vh-4rem)] bg-gradient-to-b from-[#030C09] via-[#0D3628] to-[#030C09] py-20 lg:py-14">
    <!-- Background Grid -->
    <div class="absolute inset-0 opacity-10 pointer-events-none">
        <div class="cube-grid h-full w-full"></div>
    </div>
    <div class="relative mx-auto max-w-7xl px-6 lg:px-8">
        <!-- Section Label -->
        <div class="mb-12 flex items-center gap-4">
          <span class="text-xs font-semibold tracking-[0.25em] text-[#D2B866]">07</span>
          <div class="h-px w-14 bg-[#D2B866]"></div>
          <p class="text-4xl font-bold uppercase tracking-[0.01em] text-[#D2B866]">Contact Us</p>
        </div>
        <!-- Main Layout -->
        <div class="grid grid-cols-1 items-center gap-16 lg:grid-cols-2">
            <!-- Left -->
            <div class="text-center lg:text-left">
              <h1 class="font-bold leading-none text-white text-4xl sm:text-5xl lg:text-5xl">United<br />Architects</h1>
              <h2 class="italic font-light text-gray-300 text-3xl sm:text-4xl lg:text-4xl">of the</h2>
              <h1 class="font-bold leading-none text-white text-4xl sm:text-5xl lg:text-5xl">Philippines</h1>
              <h3 class="mt-8 font-bold tracking-wide text-[#D2B866] text-3xl lg:text-4xl">AKLAN CHAPTER</h3>
              <div class="my-8 mx-auto lg:mx-0 h-[2px] w-32 bg-[#D2B866] lg:w-52"></div>
              <p class="max-w-xl mx-auto lg:mx-0 text-sm leading-relaxed text-gray-400 sm:text-base">
                  Building the future of Aklan through architecture that
                  honors heritage and embraces innovation.
              </p>
          </div>
            <!-- Right -->
          <div class="rounded-lg border border-[#D4AF37]/10 bg-[#10382C]/90 p-8 mx-auto">
              <div class="space-y-2">
                <ul class="space-y-1 flex gap-10 flex-col text-sm text-gray-400">
                  <li class="flex items-center gap-4">
                    <img src="/assets/img/loc.png" alt="" class="w-5">
                    <p class="text-md lg:text-xl font-thin text-white">Kalibo, Aklan, Philippines, 5600</p>
                  </li>
                  <li class="flex items-center gap-4">
                    <img src="/assets/img/email.png" alt="" class="w-5">
                    <p class="text-md lg:text-xl font-thin text-white">uap.aklan2026@gmail.com</p>
                  </li>
                  <li class="flex items-center gap-4">
                    <img src="/assets/img/fblogo.png" alt="" class="w-5">
                    <a href="https://facebook.com/UAPAklanChapter" class="text-md lg:text-xl font-thin text-white">facebook.com/UAPAklanChapter</a>
                  </li>
                </ul>
              </div>
            </div>
        </div>
    </div>
</section>
  <!-- Footer Placeholder -->
  <load src="./components/footer.html" />

  <!-- Shared App JS Module -->
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
