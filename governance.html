<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Governance and Accreditations information for UAP Aklan Chapter." />
  <title>Governance | UAP Aklan Chapter</title>
  <link rel="icon" type="image/png" href="/assets/img/uap-aklan-logo.jpg" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="flex flex-col min-h-full bg-[#030C09] text-gray-900 antialiased">

  <!-- Header / Navigation Placeholder -->
  <load src="./components/navbar.html" />

  <section id="governance" class="min-h-[calc(100vh-4rem)] bg-gradient-to-b from-[#030C09] via-[#0D3628] to-[#030C09] py-20 lg:py-14 relative">

    <!-- Background Pattern -->
    <div class="absolute inset-0 pointer-events-none opacity-10">
        <div class="h-full w-full cube-grid"></div>
    </div>

    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <!-- Section Label -->
        <div class="mb-12 flex items-center gap-4">
          <span class="text-xs font-semibold tracking-[0.25em] text-[#D2B866]">07</span>
          <div class="h-px w-14 bg-[#D2B866]"></div>
          <h1 class="text-4xl font-bold uppercase tracking-[0.01em] text-[#D2B866]">Governance</h1>
      </div>
        <!-- Buttons -->
        <div class="mx-auto flex max-w-xl flex-col gap-6 py-10">
            <a href="#resolutions" class="group rounded border border-[#D4AF37]/20 bg-[#0E3A2D] py-6 text-center font-bold uppercase tracking-widest text-white transition duration-300 hover:border-[#D4AF37] hover:bg-[#124132]">
                Resolutions
            </a>
            <a href="#accreditations" class="group rounded border border-[#D4AF37]/20 bg-[#0E3A2D] py-6 text-center font-bold uppercase tracking-widest text-white transition duration-300 hover:border-[#D4AF37] hover:bg-[#124132]">
                ACCREDITATIONS
            </a>
        </div>
    </div>
  </section>

  <!-- Resolutions Section -->
  <section id="resolutions" class="bg-gradient-to-b from-[#030C09] via-[#0D3628] to-[#030C09] py-20 lg:py-28 border-y border-[#D2B866]">
    <div class="mx-auto max-w-7xl px-6 lg:px-8 space-y-8">

        <!-- Section Label -->
        <div class="flex items-center gap-4">
            <span class="text-xs font-semibold tracking-[0.25em] text-[#D2B866]">
                7.1
            </span>
            <div class="h-px w-14 bg-[#D2B866]"></div>
            <h2 class="text-2xl sm:text-3xl font-semibold uppercase tracking-[0.15em] text-[#D2B866]">
                Resolutions
            </h2>
        </div>

        <div id="resolutionsContent"></div>

    </div>
  </section>

  <!-- Accreditations Section -->
  <section id="accreditations" class="bg-gradient-to-b from-[#030C09] via-[#0D3628] to-[#030C09] py-20 lg:py-28 border-y border-[#D2B866]">
    <div class="mx-auto max-w-7xl px-6 lg:px-8 space-y-8">

        <!-- Section Label -->
        <div class="flex items-center gap-4">
            <span class="text-xs font-semibold tracking-[0.25em] text-[#D2B866]">
                7.2
            </span>
            <div class="h-px w-14 bg-[#D2B866]"></div>
            <h2 class="text-2xl sm:text-3xl font-semibold uppercase tracking-[0.15em] text-[#D2B866]">
                Accreditations
            </h2>
        </div>

        <div id="accreditationsGallery"></div>

    </div>
  </section>

  <!-- Footer Placeholder -->
  <load src="./components/footer.html" />

  <!-- Shared App JS Module -->
  <script type="module" src="/assets/js/app.js"></script>
  <script type="module" src="/assets/js/governance-page.js"></script>
</body>
</html>
