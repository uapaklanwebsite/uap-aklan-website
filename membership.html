<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Membership information and application for UAP Aklan Chapter." />
  <title>Membership | UAP Aklan Chapter</title>
  <link rel="icon" type="image/png" href="/assets/img/logo.png" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="flex flex-col min-h-full bg-[#030C09] text-gray-900 antialiased">

  <!-- Header / Navigation Placeholder -->
  <load src="./components/navbar.html" />

  <section id="membership" class="min-h-[calc(100vh-4rem)] bg-gradient-to-b from-[#030C09] via-[#0D3628] to-[#030C09] py-20 lg:py-14">

    <!-- Background Pattern -->
    <div class="absolute inset-0 pointer-events-none opacity-10">
        <div class="h-full w-full cube-grid"></div>
    </div>

    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <!-- Section Label -->
        <div class="mb-12 flex items-center gap-4">
          <span class="text-xs font-semibold tracking-[0.25em] text-[#D2B866]">04</span>
          <div class="h-px w-14 bg-[#D2B866]"></div>
          <p class="text-4xl font-bold uppercase tracking-[0.01em] text-[#D2B866]">Membership</p>
      </div>
        <!-- Buttons -->
        <div class="mx-auto flex max-w-xl flex-col gap-6 py-10">
            <a href="#apply" class="group rounded border border-[#D4AF37]/20 bg-[#0E3A2D] py-6 text-center font-bold uppercase tracking-widest text-white transition duration-300 hover:border-[#D4AF37] hover:bg-[#124132]">
                Apply for Membership
            </a>
            <a href="#renewal" class="group rounded border border-[#D4AF37]/20 bg-[#0E3A2D] py-6 text-center font-bold uppercase tracking-widest text-white transition duration-300 hover:border-[#D4AF37] hover:bg-[#124132]">
                Membership Renewal
            </a>
            <a href="#transfer" class="group rounded border border-[#D4AF37]/20 bg-[#0E3A2D] py-6 text-center font-bold uppercase tracking-widest text-white transition duration-300 hover:border-[#D4AF37] hover:bg-[#124132]">
                Transfer
            </a>
        </div>
    </div>
  </section>
  <section id="apply" class="bg-gradient-to-b from-[#030C09] via-[#0D3628] to-[#030C09] py-20 lg:py-28 border-y border-[#D2B866]">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">

        <!-- Section Label -->
        <div class="mb-12 flex items-center gap-4">
            <span class="text-xs font-semibold tracking-[0.25em] text-[#D2B866]">
                4.1
            </span>
            <div class="h-px w-14 bg-[#D2B866]"></div>
            <p class="text-xs font-semibold uppercase tracking-[0.25em] text-[#D2B866]">
                Apply For A Membership
            </p>
        </div>
        <!-- Award Image -->
        <div class="flex justify-center">
            <button class="group overflow-hidden rounded-lg border border-[#D4AF37]/20 bg-[#0C2D22] p-3 shadow-lg hover:border-[#D4AF37]">
                <img
                    src="../assets/img/AWARDS.png"
                    alt="UAP Aklan Awards"
                    class="w-full max-w-xs sm:max-w-sm md:max-w-md lg:max-w-lg object-contain"
                />
            </button>
        </div>
    </div>
  </section>
  <section id="renewal" class="bg-gradient-to-b from-[#030C09] via-[#0D3628] to-[#030C09] py-20 lg:py-28 border-y border-[#D2B866]">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">

        <!-- Section Label -->
        <div class="mb-12 flex items-center gap-4">
            <span class="text-xs font-semibold tracking-[0.25em] text-[#D2B866]">
                4.2
            </span>
            <div class="h-px w-14 bg-[#D2B866]"></div>
            <p class="text-xs font-semibold uppercase tracking-[0.25em] text-[#D2B866]">
                Membership Renewal
            </p>
        </div>
        <!-- Award Image -->
        <div class="flex justify-center">
            <button class="group overflow-hidden rounded-lg border border-[#D4AF37]/20 bg-[#0C2D22] p-3 shadow-lg hover:border-[#D4AF37]">
                <img
                    src="../assets/img/AWARDS.png"
                    alt="UAP Aklan Awards"
                    class="w-full max-w-xs sm:max-w-sm md:max-w-md lg:max-w-lg object-contain"
                />
            </button>
        </div>
    </div>
  </section>
  <section id="transfer" class="bg-gradient-to-b from-[#030C09] via-[#0D3628] to-[#030C09] py-20 lg:py-28 border-y border-[#D2B866]">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">

        <!-- Section Label -->
        <div class="mb-12 flex items-center gap-4">
            <span class="text-xs font-semibold tracking-[0.25em] text-[#D2B866]">
                4.3
            </span>
            <div class="h-px w-14 bg-[#D2B866]"></div>
            <p class="text-xs font-semibold uppercase tracking-[0.25em] text-[#D2B866]">
                Transfer
            </p>
        </div>
        <!-- Award Image -->
        <div class="flex justify-center">
            <button class="group overflow-hidden rounded-lg border border-[#D4AF37]/20 bg-[#0C2D22] p-3 shadow-lg hover:border-[#D4AF37]">
                <img
                    src="../assets/img/AWARDS.png"
                    alt="UAP Aklan Awards"
                    class="w-full max-w-xs sm:max-w-sm md:max-w-md lg:max-w-lg object-contain"
                />
            </button>
        </div>
    </div>
  </section>
  <!-- Footer Placeholder -->
  <load src="./components/footer.html" />

  <!-- Shared App JS Module -->
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
